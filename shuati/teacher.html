<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>刷題 · 老師端</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1c2430; --sub:#66707e;
  --line:#e3e7ec; --accent:#2b6cb0; --accent-ink:#ffffff;
  --ok:#2f855a; --ok-bg:#d7efe1; --bad:#c53030; --bad-bg:#fbdcdc;
  --warn:#b7791f; --warn-bg:#fdf0d5; --chip:#eef1f5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14181e; --card:#1e242c; --ink:#e8ecf1; --sub:#98a2ae;
    --line:#313a45; --accent:#63a4e0; --accent-ink:#0e1319;
    --ok:#68c495; --ok-bg:#1f4433; --bad:#f08585; --bad-bg:#4a2626;
    --warn:#e0b050; --warn-bg:#3d3216; --chip:#2a323c;
  }
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:16px; line-height:1.6}
.wrap{max-width:1100px; margin:0 auto; padding:14px 14px 50px}
header{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding:6px 2px 12px}
header h1{font-size:20px; margin:0; letter-spacing:.05em}
header .live{font-size:13px; color:var(--sub); margin-left:auto}
.dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--line); margin-right:5px}
.dot.on{background:var(--ok)} .dot.err{background:var(--bad)}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px}
h2{font-size:16px; margin:0 0 10px}
.note{font-size:13.5px; color:var(--sub); margin-top:8px}
.hidden{display:none}
input[type=text]{width:100%; padding:10px; border:1px solid var(--line); border-radius:9px;
  background:var(--chip); color:var(--ink); font-size:14px}
button{background:var(--accent); color:var(--accent-ink); border:0; border-radius:10px;
  padding:9px 18px; font-size:15px; font-weight:600; cursor:pointer}
button.ghost{background:none; border:1px solid var(--line); color:var(--sub); font-weight:400}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{border:1px solid var(--line); background:var(--chip); color:var(--ink);
  border-radius:999px; padding:5px 13px; font-size:14px; cursor:pointer}
.chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}

/* 並排 */
.cols{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media (max-width:720px){ .cols{grid-template-columns:1fr} }
.stu h3{margin:0 0 2px; font-size:18px}
.stu .meta{font-size:13px; color:var(--sub); margin-bottom:10px}
.bar{height:12px; border-radius:999px; background:var(--chip); overflow:hidden; margin:8px 0 4px}
.bar i{display:block; height:100%; background:var(--ok); border-radius:999px; transition:width .5s}
.kpi{display:flex; gap:8px; margin:10px 0 4px}
.kpi div{flex:1; text-align:center; background:var(--chip); border-radius:9px; padding:8px 3px}
.kpi b{display:block; font-size:20px} .kpi span{font-size:11.5px; color:var(--sub)}
.now{background:var(--warn-bg); color:var(--warn); border-radius:9px; padding:7px 11px;
  font-size:13.5px; font-weight:600; margin-top:8px}
.stale{background:var(--bad-bg); color:var(--bad)}

/* 考點對照表 */
table{width:100%; border-collapse:collapse; font-size:14px}
th,td{padding:7px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle}
th{font-size:12.5px; color:var(--sub); font-weight:600; white-space:nowrap}
td.k{font-size:13px; color:var(--sub); max-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pill{display:inline-block; min-width:52px; text-align:center; border-radius:999px;
  padding:2px 9px; font-size:12.5px; font-weight:700}
.pill.done{background:var(--ok-bg); color:var(--ok)}
.pill.mid{background:var(--warn-bg); color:var(--warn)}
.pill.open{background:var(--chip); color:var(--sub)}
.pill.stuck{background:var(--bad-bg); color:var(--bad)}
tr.both{background:var(--bad-bg)}
tr.both td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.legend{font-size:12.5px; color:var(--sub); margin-top:10px}
.legend span{margin-right:14px; white-space:nowrap}
.empty{color:var(--sub); font-size:14px; padding:10px 0}

/* 總覽：每位學生做過的每一週攤在同一列 */
.ovrow{display:flex; align-items:flex-start; gap:10px; padding:7px 0;
  border-bottom:1px solid var(--line); flex-wrap:wrap}
.ovrow:last-child{border-bottom:0}
.ovname{flex:0 0 96px; font-weight:700; font-size:15px; padding-top:5px}
.ovname small{display:block; font-weight:400; font-size:11.5px; color:var(--sub)}
.ovtiles{display:flex; gap:6px; flex-wrap:wrap; flex:1}
.ovt{border:1px solid var(--line); border-radius:9px; background:var(--chip);
  padding:5px 9px; min-width:74px; cursor:pointer; text-align:center; position:relative;
  overflow:hidden}
.ovt.on{border-color:var(--accent); box-shadow:0 0 0 2px rgba(43,108,176,.18)}
.ovt b{display:block; font-size:13px; line-height:1.25}
.ovt span{display:block; font-size:11px; color:var(--sub); line-height:1.3}
.ovt i{position:absolute; left:0; bottom:0; height:3px; background:var(--ok)}
.ovt.part i{background:var(--warn)} .ovt.low i{background:var(--bad)}
.ovt.off{opacity:.55}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>刷題 · 老師端</h1>
  <span class="live" id="live"><span class="dot"></span>尚未連線</span>
</header>

<!-- 沒設定網址時才出現 -->
<div class="card hidden" id="setup">
  <h2>連上同步後端</h2>
  <div class="note" style="margin:0 0 10px">
    貼上 Apps Script 部署後的 <code>/exec</code> 網址。
    正常情況這個網址已經寫在 <code>config.js</code>，這裡只是備用；
    貼在這裡只會存在你這台裝置。
  </div>
  <input type="text" id="urlIn" placeholder="https://script.google.com/macros/s/AKfycb.../exec">
  <div style="margin-top:10px; display:flex; gap:8px">
    <button id="btnSave">連線</button>
    <button class="ghost" id="btnClear">清除</button>
  </div>
</div>

<!-- 總覽一定要排在週次卡上面：只看得到「一週」是這頁最容易誤判的地方
     （2026-08-30 實例：學生做完第 3~6 週後又回頭補第 2 週，自動追最新就停在
     第 2 週，老師以為他們只做了兩週）。 -->
<div class="card" id="overviewCard">
  <h2>總覽 — 每位學生做過的每一週</h2>
  <div id="overview"></div>
  <div class="note" id="ovNote"></div>
  <!-- 常駐診斷列：永遠顯示，讓「沒刷／沒送到／拉不下來」分得出來 -->
  <div class="note" id="diag" style="margin-top:8px; padding-top:8px; border-top:1px dashed rgba(128,128,128,.35)"></div>
</div>

<div class="card" id="weekCard">
  <h2>逐題對照：選一週</h2>
  <div class="chips" id="weekChips"></div>
  <div class="note" id="weekNote"></div>
</div>

<div class="cols" id="cols"></div>

<div class="card" id="common">
  <h2>共同弱點 — 這堂課該講的</h2>
  <div id="commonBody"></div>
  <div class="legend">
    <span><b class="pill done">攻克</b> 答對了，一次就對</span>
    <span><b class="pill done">攻克<small>（曾錯 1）</small></b> 錯過一次但救回來了 → 值得加強</span>
    <span><b class="pill mid">錯 1 次</b> 還沒重做，系統下一輪會再出</span>
    <span><b class="pill stuck">錯 2 次 · 待檢討</b> 系統不再自動出題，<b>只能課堂上講</b></span>
    <span><b class="pill open">未練</b> 這一週還沒碰到這題</span>
  </div>
</div>
</div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   老師端：兩位學生並排對照

   資料靠 JSONP 拉（不是 fetch）。Apps Script 的網頁應用程式會 302
   轉到 googleusercontent.com，轉址後的回應沒有 CORS 標頭，跨網域
   fetch 會被瀏覽器擋掉。JSONP 用 <script> 標籤載入，不受同源限制。

   這頁的重點不是「兩欄資料」，是最下面那張【共同弱點】表：
   兩個人都沒攻克的考點，才是課堂上值得花時間講的。
   ══════════════════════════════════════════════════════════════ */

const LS_URL  = "guowen_teacher_url";
// ⚠️ 2026-09-05：POLL_MS 5000→20000、逾時 12000→45000。
//    /exec 實測回應要 7.6～38.2 秒（2026-09-04 連打四次：38.2 / 7.6 / 9.5 / 7.8）。
//    舊設定是「每 5 秒發一次、12 秒判失敗」，等於要求後端做到它做不到的事：
//    請求還沒回來就又發一個，越疊越慢，看板幾乎必然空白。使用者自己的
//    看進度.py 早就用 60 秒逾時＋4 次重試才穩，這裡照那個現實調。
const POLL_MS = 20000;
const REQ_TIMEOUT_MS = 45000;
const STALE_MS = 90000;     // 超過 90 秒沒更新，視為那位學生離線

// ⚠️ 設定用 fetch + no-store 讀，不用 <script src>：後者會被瀏覽器快取，
//    改了名字或同步網址卻「看起來沒生效」，就是這個原因。
let STUDENTS = [["A","學生一"],["B","學生二"]];
const $ = id => document.getElementById(id);
const esc = t => { const d=document.createElement("div"); d.textContent=t==null?"":t; return d.innerHTML; };

let CFG_URL = "";
let URL_ = (localStorage.getItem(LS_URL) || "").trim();
let ROWS = [];
let WEEK = null;            // null = 自動追最新
let jsonpN = 0, lastOk = 0, lastErr = false;

/* ── JSONP ─────────────────────────────────────── */
let inFlight = false;       // ⚠️ 沒有這道擋板，setInterval 會在上一次還沒回來時
                            //    又發一個，請求越疊越多、後端越來越慢，自己把自己壓垮。
let detailRetried = false;  // 首次載入補拉逐題明細用，只補一次
function pull(){
  if(!URL_ || inFlight) return;
  inFlight = true;
  const cb = "__t" + (++jsonpN);
  const s = document.createElement("script");
  let done = false;
  window[cb] = rows => {
    done = true;
    ROWS = Array.isArray(rows) ? rows : [];
    lastOk = Date.now(); lastErr = false;
    cleanup(); render();
    // 第一次拉的時候還不知道要看哪一週（activeWeek 要有資料才算得出來），
    // 所以那一次一定是 slim、沒有逐題明細。這裡補拉一次，不用等 20 秒。
    // needDetail 只允許補一次，避免變成無窮迴圈。
    const wk = (WEEK != null) ? WEEK : activeWeek();
    const has = wk && ROWS.some(r => Number(r.week) === wk && (r.seeds || []).length);
    if(wk && !has && !detailRetried){ detailRetried = true; setTimeout(pull, 300); }
    if(has) detailRetried = false;
  };
  const cleanup = () => { inFlight = false; delete window[cb]; s.remove(); };
  s.onerror = () => { if(!done){ lastErr = true; cleanup(); paintLive(); } };
  setTimeout(() => { if(!done){ lastErr = true; cleanup(); paintLive(); } }, REQ_TIMEOUT_MS);
  // 所有列都瘦身，只有「正在看的那一週」帶逐題明細。
  // ⚠️ 不能寫成 week=N 只拉那一週：上方總覽要的是「每位學生的每一週」，
  //    那樣寫會讓總覽整排消失。full=N 兩者兼顧。
  // seeds 塞了每題的題幹，一列約 6 KB；不瘦身的話題刷越多輪詢越慢。
  const wkNow = (WEEK != null) ? WEEK : activeWeek();
  const extra = wkNow ? ("&full=" + wkNow) : "&slim=1";
  s.src = URL_ + (URL_.includes("?") ? "&" : "?") + "callback=" + cb + extra + "&_=" + Date.now();
  document.body.appendChild(s);
}

// ⚠️ 這一段是整個修復的重點。舊版把三種完全不同的狀況顯示成同一句
//    「還沒有資料」，老師不可能分辨：
//      A 學生沒刷　B 學生刷了但資料沒送到　C 送到了但這頁拉不下來
//    分不出來，就只能瞎猜、重部署、然後還是不知道發生什麼事。
function paintLive(){
  const el = $("live");
  if(!URL_){ el.innerHTML = `<span class="dot"></span>未設定同步網址`; return; }
  if(lastErr && !lastOk){
    el.innerHTML = `<span class="dot err"></span>🔴 連不上後端 —— 這是老師端的問題，<b>不代表學生沒刷</b>`;
    return;
  }
  if(!lastOk){ el.innerHTML = `<span class="dot"></span>連線中…（後端通常要 8～40 秒）`; return; }
  const s = Math.round((Date.now() - lastOk) / 1000);
  el.innerHTML = `<span class="dot ${lastErr ? "err" : "on"}"></span>`
    + (lastErr ? "更新失敗，顯示的是上一次的資料"
               : `${s < 25 ? "剛剛" : s + " 秒前"}更新 · 每 ${POLL_MS/1000} 秒自動重整`);
}

// 常駐診斷列：不論有沒有資料都要顯示，讓「後端是通的但沒收到這位學生的資料」
// 這種狀況看得出來。沒有這一列，空白畫面永遠有三種解釋。
function paintDiag(){
  const el = $("diag");
  if(!el) return;
  if(!lastOk){ el.innerHTML = `尚未成功取得任何回應。`; return; }
  const newest = ROWS.reduce((m, r) => (r.ts > (m ? m.ts : 0) ? r : m), null);
  const trimmed = ROWS.filter(r => (r.logTrimmed || 0) > 0);
  // 稽核警訊：歸零與匯入是學生洗掉錯誤紀錄最容易的兩條路。這裡把痕跡攤開，
  // 每位學生只看最新一列的 audit（同一台裝置的累計值）。
  const auditByStu = {};
  for(const r of ROWS){
    const a = r.audit; if(!a) continue;
    const cur = auditByStu[r.sid];
    if(!cur || r.ts > cur.ts) auditByStu[r.sid] = {ts:r.ts, name:r.name || r.sid, a};
  }
  const flags = Object.values(auditByStu)
    .filter(x => (x.a.resets || 0) > 0 || (x.a.imports || 0) > 0)
    .map(x => `${esc(x.name)}：`
      + ((x.a.resets || 0) ? `歸零過 <b>${x.a.resets}</b> 次（最後 ${esc(x.a.lastReset || "?")}，`
          + `丟掉 ${x.a.lostFirst || 0} 題紀錄）` : "")
      + ((x.a.imports || 0) ? `${(x.a.resets||0) ? "、" : ""}匯入過 <b>${x.a.imports}</b> 次`
          + `（最後 ${esc(x.a.lastImport || "?")}）` : "")
      // 換人：畫面上的按鈕已移除，正常情況這個數字永遠是 0。
      // 一旦不是 0，代表有人動用了 ?who= 網址——不是你自己做的就要問一下。
      + ((x.a.switches || 0) ? `${(x.a.resets||0)||(x.a.imports||0) ? "、" : ""}`
          + `<b>換過身分 ${x.a.switches} 次</b>（最後 ${esc(x.a.lastSwitch || "?")}）` : ""));
  el.innerHTML =
    `後端最後成功回應：${ago(Date.now() - lastOk)}　·　表內 ${ROWS.length} 列　·　` +
    (newest ? `最新一列：${esc(newest.name || newest.sid)} 第 ${newest.week} 週，${ago(Date.now() - newest.ts)}`
            : `<b>表是空的——後端正常，但一位學生的資料都沒收到</b>`) +
    (trimmed.length ? `<br><b style="color:var(--bad)">⚠ ${trimmed.map(r => esc(r.name || r.sid)).join("、")}
      的作答紀錄有被裁掉（超過上限），早期週次的統計可能不完整。</b>` : "") +
    (flags.length ? `<br><b style="color:var(--bad)">⚠ 進度被重置或匯入過 —— ${flags.join("；")}</b>` : "");
}

/* ── 畫面 ──────────────────────────────────────── */
function weeksSeen(){
  return [...new Set(ROWS.map(r => Number(r.week)).filter(n => n > 0))].sort((a,b) => a-b);
}
function activeWeek(){
  if(WEEK != null) return WEEK;
  // 自動：挑最近有人動過的那一週
  // ⚠️ 一定要跟 weeksSeen() 用同一組過濾（week>0、非 TEST）。GAS 那邊的
  //    selfTest() 會寫一列 sid=TEST / week=0，連線測試也是寫這一列；它一旦
  //    變成最新，這裡就會回傳 0，兩位學生的卡片全變成「第 0 週還沒有資料」，
  //    看起來像後端壞掉，其實只是追到測試列。
  let best = null, bt = -1;
  for(const r of ROWS){
    if(r.sid === "TEST" || !(Number(r.week) > 0)) continue;
    if(r.ts > bt){ bt = r.ts; best = Number(r.week); }
  }
  return best;
}
function rowFor(sid, week){
  return ROWS.find(r => r.sid === sid && Number(r.week) === week) || null;
}
// ⚠️ 2026-09-05 改寫（使用者裁示：「什麼題目錯了一次，什麼題目錯兩次，才是重點」）。
//    舊版把三種狀況壓成同一個字，老師分不出來：
//      · 錯 1 次後來答對 → 顯示「攻克」，完全看不出他曾經錯過
//      · 錯 1 次還沒重做 → 顯示「練過」
//      · 錯 2 次（已退場待檢討）→ 也顯示「練過」（「卡住」要 tries>=3 才亮）
//    資料（wrong）學生端本來就在傳，是這裡把它丟掉了。
function pillOf(s){
  if(!s) return `<span class="pill open">–</span>`;
  const w = s.wrong || 0;
  if(s.review) return `<span class="pill stuck">錯 ${w} 次 · 待檢討</span>`;
  if(s.done) return w
    ? `<span class="pill done">攻克<small>（曾錯 ${w}）</small></span>`
    : `<span class="pill done">攻克</span>`;
  if(w >= 2) return `<span class="pill stuck">錯 ${w} 次</span>`;
  if(w === 1) return `<span class="pill mid">錯 1 次</span>`;
  if((s.tries||0) > 0) return `<span class="pill open">練過</span>`;
  return `<span class="pill open">未練</span>`;
}

function ago(ms){
  const m = Math.round(ms / 60000);
  if(m < 1) return "剛剛";
  if(m < 60) return m + " 分鐘前";
  const h = Math.round(m / 60);
  return h < 48 ? h + " 小時前" : Math.round(h / 24) + " 天前";
}

// 每位學生一列，做過的每一週各一格。這頁原本只能一次看一週，
// 週次藏在 chip 裡，等於要老師自己一格一格點過去才知道有沒有做——
// 實際上就漏看了第 3~6 週。這一區的作用只有一個：不要讓任何一週被藏起來。
function renderOverview(wk){
  const box = $("overview");
  box.innerHTML = "";
  let any = false;
  for(const [sid, fallback] of STUDENTS){
    const mine = ROWS.filter(r => r.sid === sid && Number(r.week) > 0)
                     .sort((a, b) => Number(a.week) - Number(b.week));
    const row = document.createElement("div");
    row.className = "ovrow";
    const last = mine.length ? Math.max(...mine.map(r => r.ts || 0)) : 0;
    const name = (mine[0] && mine[0].name) || fallback;
    row.innerHTML = `<div class="ovname">${esc(name)}<small>${
      last ? "最後作答 " + ago(Date.now() - last) : "沒有紀錄"}</small></div>`;
    const tiles = document.createElement("div");
    tiles.className = "ovtiles";
    if(!mine.length){
      tiles.innerHTML = `<span class="empty">還沒有任何一週的資料</span>`;
    }
    for(const r of mine){
      any = true;
      // ⚠️ 2026-09-06：把「做完」擺到最顯眼的位置。
      //    舊版只顯示「攻克 x/y」，而攻克＝答對且已脫離錯題佇列，
      //    跟「有沒有刷完」是兩回事——41 題全做完但只攻克 27 題，
      //    舊版顯示「27/41」，看起來像還有 14 題沒做。我自己就讀錯過。
      const fin = r.answered || 0;                       // 做完幾題（首答過）
      const finPct = r.total ? Math.round(fin / r.total * 100) : 0;
      const pct = r.total ? Math.round(r.done / r.total * 100) : 0;
      const acc = r.answered ? Math.round(r.correct / r.answered * 100) : null;
      const b = document.createElement("button");
      // 底色條改看「做完率」——這一格要回答的問題是「刷完了沒」。
      b.className = "ovt " + (finPct >= 100 ? "" : finPct >= 50 ? "part" : "low")
                    + (Number(r.week) === wk ? " on" : "") + (finPct < 10 ? " off" : "");
      b.innerHTML = `<b>第 ${r.week} 週</b>
        <span>${finPct >= 100 ? "✓ 刷完" : `做完 ${fin}/${r.total}`}</span>
        <span>攻克 ${r.done}　答對 ${acc == null ? "–" : acc + "%"}</span>
        <i style="width:${finPct}%"></i>`;
      b.title = `第 ${r.week} 週：做完 ${fin}/${r.total}（${finPct}%）、`
              + `攻克 ${r.done}/${r.total}、首答答對率 ${acc == null ? "–" : acc + "%"}、`
              + `最後同步 ${ago(Date.now() - (r.ts || 0))}`;
      b.onclick = () => { WEEK = Number(r.week); pickWeek(); };
      tiles.appendChild(b);
    }
    row.appendChild(tiles);
    box.appendChild(row);
  }
  $("ovNote").textContent = any
    ? "點任一格可以切到那一週的逐題對照。底線長度＝做完的比例。"
      + "「做完」＝這一週的題碰過幾題；「攻克」＝答對且已脫離錯題佇列。兩者不同。"
    : "後端正常，但一位學生的資料都沒收到。可能是還沒刷，也可能是送不出去——請學生按「匯出進度給老師」就能分辨。";
}

// 切換週次時要重新拉那一週的逐題明細（明細只拉「正在看的那一週」，
// 只 render 不 pull 的話點了會停在「明細載入中」）。
function pickWeek(){ detailRetried = false; render(); pull(); }
function render(){
  paintLive();
  paintDiag();
  const weeks = weeksSeen();
  const wk = activeWeek();
  renderOverview(wk);

  const wc = $("weekChips"); wc.innerHTML = "";
  if(!weeks.length){
    wc.innerHTML = `<span class="empty">後端正常，但一位學生的資料都沒收到。可能是還沒刷，也可能是送不出去——請學生按「匯出進度給老師」就能分辨。</span>`;
  } else {
    const auto = document.createElement("button");
    auto.className = "chip" + (WEEK == null ? " on" : "");
    auto.textContent = "自動追最新";
    auto.onclick = () => { WEEK = null; pickWeek(); };
    wc.appendChild(auto);
    for(const w of weeks){
      const c = document.createElement("button");
      c.className = "chip" + (WEEK === w ? " on" : "");
      c.textContent = "第 " + w + " 週";
      c.onclick = () => { WEEK = w; pickWeek(); };
      wc.appendChild(c);
    }
  }
  // 講清楚「自動追最新」追的是什麼：它挑的是最後被動到的那一週，不是進度最前面
  // 的那一週。學生回頭補舊的一週，這裡就會退回去，看起來像進度倒退。
  const autoNote = "（自動追最新＝最後被動到的那一週，不一定是進度最前面的那一週。"
                 + "完整進度看上面的總覽。）";
  $("weekNote").textContent = wk
    ? `目前顯示第 ${wk} 週。兩位學生的第 ${wk} 週是同一組題，所以可以逐題對照。`
      + (WEEK == null ? autoNote : "")
    : "";

  // ── 兩欄 ──
  const cols = $("cols"); cols.innerHTML = "";
  for(const [sid, fallback] of STUDENTS){
    const r = wk ? rowFor(sid, wk) : null;
    const d = document.createElement("div");
    d.className = "card stu";
    if(!r){
      // ⚠️ 三態要分開講。舊版一律顯示「還沒開始，或還沒進到這一週」，
      //    把「後端掛了」「他沒刷」「他在刷別週」全部混成同一句。
      const mine = ROWS.filter(x => x.sid === sid && Number(x.week) > 0);
      const last = mine.length ? Math.max(...mine.map(x => x.ts || 0)) : 0;
      let msg;
      if(lastErr && !lastOk){
        msg = `🔴 <b>連不上後端</b>，所以看不到他的資料。<b>這不代表他沒刷。</b>`;
      } else if(!mine.length){
        msg = `⚪ <b>後端正常，但一筆都沒收到他的資料。</b>可能是還沒刷，`
            + `也可能是他的裝置送不出去（例如沒點「我是誰」）。`
            + `請他按「匯出進度給老師」把進度傳給你，就能分辨。`;
      } else {
        const lastW = mine.reduce((m, x) => (x.ts > (m ? m.ts : 0) ? x : m), null);
        msg = `🔵 <b>他有在刷，只是還沒進到第 ${wk} 週。</b>`
            + `最後動的是第 ${lastW.week} 週，${ago(Date.now() - last)}。`;
      }
      d.innerHTML = `<h3>${esc(fallback)}</h3><div class="meta">第 ${wk || "?"} 週沒有資料</div>
        <div class="empty">${msg}</div>`;
      cols.appendChild(d); continue;
    }
    const fin = r.answered || 0;
    const finPct = r.total ? Math.round(fin / r.total * 100) : 0;
    const pct = r.total ? Math.round(r.done / r.total * 100) : 0;
    const acc = r.answered ? Math.round(r.correct / r.answered * 100) : null;
    const age = Date.now() - (r.ts || 0);
    const stale = age > STALE_MS;
    d.innerHTML =
      `<h3>${esc(r.name || fallback)}</h3>
       <div class="meta">第 ${r.week} 週 · 已練 ${r.round} 輪 · ${stale ? Math.round(age/60000) + " 分鐘前" : "作答中"}</div>
       <div class="bar"><i style="width:${finPct}%"></i></div>
       <div class="meta">${finPct >= 100 ? "✓ 這一週的題已經刷完" : `還有 ${r.total - fin} 題沒做`}
         　·　攻克 ${r.done} / ${r.total} 個考點</div>
       <div class="kpi">
         <div><b>${fin}/${r.total}</b><span>做完</span></div>
         <div><b>${r.done}/${r.total}</b><span>攻克</span></div>
         <div><b>${acc == null ? "–" : acc + "%"}</b><span>首答答對率</span></div>
       </div>` +
      (r.inRound && !stale
        ? `<div class="now">正在作答：第 ${r.inRound.i} / ${r.inRound.n} 題</div>`
        : stale ? `<div class="now stale">${Math.round(age/60000)} 分鐘沒有動作</div>` : "");
    cols.appendChild(d);
  }

  // ── 共同弱點 ──
  const body = $("commonBody");
  const rA = wk ? rowFor(STUDENTS[0][0], wk) : null;
  const rB = wk ? rowFor(STUDENTS[1][0], wk) : null;
  if(!rA && !rB){ body.innerHTML = `<div class="empty">等兩位學生開始作答後，這裡會列出這一週每一題的逐題對照。</div>`; return; }

  // ⚠️ 瘦身（slim/full）之後 seeds 可能是空的。舊寫法 (rA && rA.seeds.length ? rA : rB).seeds
  //    在 rB 為 null 時會直接丟 TypeError，整頁白掉。
  const seedsOf = r => (r && Array.isArray(r.seeds)) ? r.seeds : [];
  const base = seedsOf(rA).length ? seedsOf(rA) : seedsOf(rB);
  if(!base.length){
    body.innerHTML = `<div class="empty">逐題明細載入中…（為了讓看板快一點，明細只拉正在看的那一週）</div>`;
    return;
  }
  const mapB = new Map((rB ? rB.seeds : []).map(s => [s.k, s]));
  const mapA = new Map((rA ? rA.seeds : []).map(s => [s.k, s]));

  const rows = base.map((s, i) => {
    const a = mapA.get(s.k), b = mapB.get(s.k);
    // 「共同弱點」＝兩個人都『練過』且都『沒攻克』。
    // ⚠️ 不能寫成 (!a || !a.done) —— 那會把「另一位還沒開始」也算成共同弱點。
    //    沒作答是「未知」，不是「弱」。少了 tries>0 這個條件，開課第一分鐘
    //    整張表會全部標紅，老師被誤導去講其實沒人卡住的考點。
    const bothOpen = !!a && !!b && !a.done && !b.done && a.tries > 0 && b.tries > 0;
    const worst = Math.max((a && a.wrong) || 0, (b && b.wrong) || 0);
    return {i, k: s.k, sub: s.sub, stem: s.stem, point: s.point || "", a, b, bothOpen, worst};
  });
  const nBoth = rows.filter(r => r.bothOpen).length;

  // ── 該檢討的題（使用者：「每週抓兩週的題目出來檢討與加強」）──
  // 排序＝有人錯得最多的排最前面。錯 2 次以上的是已退場、系統不會再出的，
  // 只能靠課堂處理，所以放最上面。
  const todo = rows.filter(r => r.worst > 0).sort((x, y) => y.worst - x.worst);
  const n2 = todo.filter(r => r.worst >= 2).length;

  // ── 考點欄要誠實 ──
  // 799 題只有 42 題有考點標註（第 13/18/20 週一題都沒有）。舊版這一欄標題寫
  // 「考點」卻顯示題幹前 22 字，會讓人以為系統有考點分析。有就給考點，
  // 沒有就明說沒有，不拿題幹冒充。
  const hasPoint = rows.filter(r => r.point).length;
  const cell = r => r.point
    ? `<td class="k" title="${esc(r.stem)}">${esc(r.point)}</td>`
    : `<td class="k" title="${esc(r.stem)}">${esc(r.stem)}…<small style="opacity:.5">（無考點標註）</small></td>`;

  body.innerHTML =
    `<div class="note" style="margin:0 0 10px">` +
      (todo.length
        ? `<b style="color:var(--bad)">這一週有 ${todo.length} 題有人做錯</b>` +
          (n2 ? `，其中 <b style="color:var(--bad)">${n2} 題錯了 2 次以上</b>（系統已不再自動出題，只能課堂上講）` : "") + `。`
        : `這一週目前沒有人做錯。`) +
      (nBoth ? `　另有 ${nBoth} 個兩人都還沒攻克（下方紅底）。` : "") +
    `</div>` +
    (todo.length
      ? `<table><thead><tr>
           <th style="width:74px">題型</th><th>該檢討的題（錯最多的在最上面）</th>
           <th style="width:64px">${esc((rA && rA.name) || STUDENTS[0][1])}</th>
           <th style="width:64px">${esc((rB && rB.name) || STUDENTS[1][1])}</th>
         </tr></thead><tbody>` +
        todo.map(r =>
          `<tr class="${r.worst >= 2 ? "both" : ""}">
             <td>${esc(r.sub)}</td>${cell(r)}
             <td>${pillOf(r.a)}</td><td>${pillOf(r.b)}</td>
           </tr>`).join("") +
        `</tbody></table>` : "") +
    `<div class="note" style="margin:14px 0 6px">
       以下是本週全部 ${rows.length} 題的逐題對照。` +
       (hasPoint < rows.length
         ? `<b>本週 ${rows.length} 題只有 ${hasPoint} 題有考點標註</b>，其餘顯示題幹，不是考點。`
         : "") +
    `</div>
     <table><thead><tr>
       <th style="width:26px">#</th><th style="width:74px">題型</th><th>考點／題幹</th>
       <th style="width:64px">${esc((rA && rA.name) || STUDENTS[0][1])}</th>
       <th style="width:64px">${esc((rB && rB.name) || STUDENTS[1][1])}</th>
     </tr></thead><tbody>` +
     rows.map(r =>
       `<tr class="${r.bothOpen ? "both" : ""}">
          <td>${r.i + 1}</td><td>${esc(r.sub)}</td>${cell(r)}
          <td>${pillOf(r.a)}</td><td>${pillOf(r.b)}</td>
        </tr>`).join("") +
     `</tbody></table>`;
}

/* ── 啟動 ──────────────────────────────────────── */
$("btnSave").onclick = () => {
  const v = $("urlIn").value.trim();
  if(!v) return;
  localStorage.setItem(LS_URL, v); URL_ = v;
  $("setup").classList.add("hidden");
  lastOk = 0; lastErr = false; pull();
};
$("btnClear").onclick = () => { localStorage.removeItem(LS_URL); URL_ = CFG_URL; $("urlIn").value = ""; render(); };

(async () => {
  try{
    const c = await fetch("config.json", {cache:"no-store"}).then(r => r.json());
    CFG_URL = (c.SYNC_URL || "").trim();
    if(Array.isArray(c.STUDENTS) && c.STUDENTS.length >= 2) STUDENTS = c.STUDENTS;
  }catch(e){ /* 沒有 config.json 就用預設，等使用者手動貼網址 */ }
  if(!URL_) URL_ = CFG_URL;
  if(!URL_) $("setup").classList.remove("hidden");
  else $("urlIn").value = URL_;
  render();
  pull();
  setInterval(pull, POLL_MS);
  setInterval(paintLive, 1000);
})();
</script>
</body>
</html>
